<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>广州美食指南 - 发现地道粤式美味</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <nav class="container">
        <a href="#" class="logo">🥟 广州美食指南</a>
        <ul class="nav-links">
          <li><a href="#" class="active">首页</a></li>
          <li><a href="#about">关于</a></li>
          <li><a href="#contact">联系</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <section class="hero">
        <h1>发现地道广州美味</h1>
        <p>探索越秀、天河、荔湾三大区域的传统粤式美食</p>
      </section>

      <div class="district-selector">
        <button class="district-btn active" data-district="all">全部地区</button>
        <button class="district-btn" data-district="yuexiu">越秀区</button>
        <button class="district-btn" data-district="tianhe">天河区</button>
        <button class="district-btn" data-district="liwan">荔湾区</button>

        <!-- 新增：只看推荐 -->
        <label style="margin-left:auto;display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="toggleRecommended"> 只看推荐
        </label>

        <!-- 按钮 UI -->
        <div style="display:flex; gap:8px; align-items:center; margin:8px 0;">
          <button id="btnPrecache">缓存当前资源</button>
          <button id="btnClearCache">清空缓存</button>
          <span id="cacheStatus" style="font-size:12px;color:#666;"></span>
        </div>
      </div>

      <section id="food-list">
        <div class="loading">
          <div class="spinner"></div>
          <p>正在加载美食信息...</p>
        </div>
      </section>
    </main>

    <!-- 详细信息模态框 -->
    <div class="detail-modal" id="detailModal">
      <div class="modal-content">
        <div class="modal-header">
          <img class="modal-main-image" id="modalMainImage" src="" alt="" />
          <button class="modal-close" onclick="closeDetailModal()">&times;</button>
        </div>
        <div class="modal-body">
          <h2 class="modal-title" id="modalTitle"></h2>

          <div class="modal-meta">
            <div class="meta-item"><span class="meta-icon">⭐</span><span id="modalRating"></span></div>
            <div class="meta-item"><span class="meta-icon">💰</span><span id="modalPrice"></span></div>
            <div class="meta-item"><span class="meta-icon">🕒</span><span id="modalHours"></span></div>
            <div class="meta-item"><span class="meta-icon">📍</span><span id="modalLocation"></span></div>
            <div class="meta-item"><span class="meta-icon">📞</span><span id="modalPhone"></span></div>
            <div class="meta-item"><span class="meta-icon">🏷️</span><span id="modalType"></span></div>
          </div>

          <div class="detail-section">
            <h3 class="section-title">🍽️ 餐厅介绍</h3>
            <div class="section-content" id="modalDescription"></div>
          </div>

          <div class="detail-section">
            <h3 class="section-title">⭐ 招牌特色</h3>
            <div class="specialty-list" id="modalSpecialties"></div>
          </div>

          <div class="detail-section" id="detailedInfoSection" style="display:none">
            <h3 class="section-title">📖 详细信息</h3>
            <div id="detailedInfoContent"></div>
          </div>

          <div class="detail-section">
            <h3 class="section-title">📸 图片展示</h3>
            <div class="image-gallery" id="modalGallery"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 图片查看器 -->
    <div class="image-viewer" id="imageViewer">
      <div class="viewer-content">
        <div class="viewer-close" onclick="closeImageViewer()">&times;</div>
        <img class="viewer-image" id="viewerImage" src="" alt="" />
      </div>
    </div>

    <script src="./js/app.js" defer></script>
    <script>
      // 注册 Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
            console.log('SW registered', reg);

            // 监听来自 SW 的反馈
            navigator.serviceWorker.addEventListener('message', (evt) => {
              const s = document.getElementById('cacheStatus');
              if (evt.data?.type === 'PRECACHE_DONE') {
                s.textContent = `已缓存（版本 ${evt.data.version}）`;
              }
              if (evt.data?.type === 'CLEAR_DONE') {
                s.textContent = '缓存已清空';
              }
            });

            const btnPre = document.getElementById('btnPrecache');
            const btnClr = document.getElementById('btnClearCache');
            const status = document.getElementById('cacheStatus');

            btnPre?.addEventListener('click', async () => {
              const sw = await navigator.serviceWorker.ready;
              sw.active?.postMessage({ type: 'PRECACHE_NOW' });
              status.textContent = '正在缓存...';
            });

            btnClr?.addEventListener('click', async () => {
              const sw = await navigator.serviceWorker.ready;
              sw.active?.postMessage({ type: 'CLEAR_CACHE' });
              status.textContent = '正在清空缓存...';
            });

          } catch (e) {
            console.warn('SW register failed', e);
          }
        });
      } else {
        console.warn('Service Worker not supported');
      }
    </script>
  </body>
</html>
